<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description"
    content="AI Roast My Code analyzes your code, scores it, finds issues, and gives you brutally honest improvements." />

    <title>AI Roast My Code</title>
    <link rel="stylesheet" href="css/title.css"/>
    <link rel="stylesheet" href="css/fire.css">
    <link rel="stylesheet" href="css/layout.css">
    </head>
    <body>
        <main>

            <div class="headline">
            
                <div class="roast-title">
                    <span class="roast-word">🔥Roast</span>
                    <span>My Code</span>
                </div>
            
                <div class="random-words">
                    <p>Submit your code. Prepare for emotional damage.😈</p>
                </div>
            
            </div>

        <section class="code-input">

        <div class="pasted-code">
            <label for="code-input">1. Paste your code</label>
            <textarea 
            id="code-input" 
            placeholder="Please paste code here">
            </textarea>
            <div class="language-detected">
                <span>Language detected:</span>
                <strong>...</strong>
            </div>
            </div>

            <div class="language">
                <label for="language">2. Choose Language</label>

                <select id="language">
                    <option>Java</option>
                    <option>Python</option>
                    <option>C++</option>
                    <option>Java</option>
                </select>
            </div>

            <div class="personality">
                <label for="personality">3. Roast Personality</label>

                <select id="personality">
                    <option>Brutal 😈</option>
                    <option>Funny 😂</option>
                    <option>Teacher 👨‍🏫</option>
                    <option>Senior Engineer 💀</option>
                    <option>Gen Z 🔥</option>
                </select>
            </div>

            <div class="roast-code-btn">
                <button id="roast-code">🔥Roast My Code</button>
                <p>Warning: Results may be painful.💀</p>
            </div>

            </section>

        
<section class="results">
        <div class="title">
       <h2>THE ROAST</h2> 
       <p>Your code has been judged... </p>
        </div>

        <div class="score">
       <h2> CODE SCORE</h2>
       <p>72/100</p>
        </div>

        <div class="analysis">
            <h2>ISSUES FOUND</h2>
            Analysis will appear here...
        </div>

        <div class="improvement">
            <h2>IMPROVEMENTS</h2>
            No suggestions
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
